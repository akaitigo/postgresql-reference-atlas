    portable_criterion: 対象分野の母集団を自己申告Scopeではなく一次資料本文または固定Surface Artifactから導き、全本文をDigest固定し、Locator単位で分類・Reviewする。
    postgresql_denominator: unique Authority document × fixed raw selector anchor × explicit Human classification decision
    status: partial
    evidence: [sources.lock.yaml, authority/body-inventory.snapshot.json, authority/review-queue.snapshot.json, authority/reviews/decisions.json, baselines/authority-body-inventory-v1.json, evidence/authority-body-non-regression-report.json, authority/extraction.snapshot.json, authority/locator-extraction.snapshot.json]
    gaps: [unique document 398件からfixed selectorでraw anchor 5,512件を列挙し全件Review queueへ接続したが、failed document hold 8件、pending-human 5,512件、Human review 0件、Surface/Atomic behavior昇格0件で、Authority semanticsとdenominatorは未Closureである。]
  - id: surface-atomic-behavior-variant
    portable_criterion: Authority Surfaceを一意なAtomic behavior、Target、Claimへ接続し、同じObservable Contractの実装差だけをVariantとして比較する。
    postgresql_denominator: Human-reviewed raw anchor decisionsから昇格したAtomic behavior × applicable PostgreSQL implementation variants
    status: partial
    evidence: [surface.inventory.yaml, evidence/definitive-audit-report.json]
    gaps: [既存11,340件は自動生成mapping candidateでありSemantic Surface実績に算入しない。Human decision後の昇格Atomic behaviorは0件、Variant IDは0件である。]
  - id: real-runtime-lab
    portable_criterion: 各Behaviorを対象Runtime/Platform上で起動・操作・破棄し、Source/Harness digestと実Versionを記録する。Mock/static fixtureは実Runtime Profileの代替にしない。
    postgresql_denominator: required behavior × PostgreSQL version/runtime/profile
    status: partial
    evidence: [verification.matrix.yaml, evidence/scenarios/index.json, evidence/reference-system.evidence.yaml, evidence/compatibility-matrix.evidence.yaml]
    gaps: [29 Behavior × 10 Scenarioを専用Proofへ分割しbounded補助Evidence 69件を保持し、Security 12 rowは全Variant、retry 0、固定PostgreSQL/psql runtime、Oracle、Source/Harness digest、SQL/plan/WAL/log/metricを同一実行へ結んだ。残り278 rowとAuthority由来全Behavior・必要Profileの専用Runtime Evidenceは未Closureである。]
