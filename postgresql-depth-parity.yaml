    postgresql_denominator: required behavior × PostgreSQL version/runtime/profile
    status: partial
    evidence: [verification.matrix.yaml, evidence/reference-system.evidence.yaml, evidence/compatibility-matrix.evidence.yaml]
    gaps: [全Behaviorと必要Profileの専用Runtime Evidenceへ未分割である。]
