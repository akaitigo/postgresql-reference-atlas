name: atlas-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PostgreSQL Atlas
        uses: actions/checkout@v4
        with:
          path: postgresql-reference-atlas
          fetch-depth: 0
      - name: Checkout reference-atlas-core Definitive v2
        uses: actions/checkout@v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: reference-atlas-core
      - name: Install CI dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate common manifests
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core validate
      - name: Audit mastery and cross-manifest contracts
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core audit
      - name: Enforce published-main non-regression baseline
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core non-regression-audit core-non-regression-audit authority-body-non-regression-audit
      - name: Audit Definitive inventory and open proof ledger
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core definitive-audit parity-audit authority-locator-verify authority-body-verify authority-review-verify authority-review-determinism-test definitive-skill-eval-verify scenario-proofs-verify scenario-closure-plan-verify scenario-evidence-atomicity-test core-scenario-trace-audit core-scenario-plan-audit core-evidence-durability-audit core-authority-audit core-authority-body-audit core-authority-review-audit core-skill-router-audit depth-parity-audit
      - name: Assert Definitive promotion remains blocked while incomplete
        run: |
          if make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core definitive-gate; then
            echo "incomplete repository unexpectedly passed Definitive promotion" >&2
            exit 1
          fi
      - name: Run static publication gates
        run: make -C postgresql-reference-atlas test-static
      - name: Evaluate router skill
        run: make -C postgresql-reference-atlas eval
      - name: Refresh Graph after tracked generators
        run: make -C postgresql-reference-atlas scenario-proofs-generate scenario-closure-plan-generate provenance ledger-output-verify evidence-dependency-generate
      - name: Verify Evidence Dependency Graph
        run: make -C postgresql-reference-atlas evidence-dependency-verify evidence-dependency-negative-test core-evidence-dependency-audit
      - name: Verify task-owned Docker volume cleanup
        run: make -C postgresql-reference-atlas docker-volume-cleanup-test
      - name: Check committed evidence freshness
        run: make -C postgresql-reference-atlas evidence-freshness
      - name: Check committed evidence pipeline clean
        run: make -C postgresql-reference-atlas evidence-pipeline-clean
      - name: Verify pushed commit signature
        if: github.event_name == 'push'
        run: make -C postgresql-reference-atlas commit-signature-verify

  executable-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lab: [authority-lock, definitive-inventory, sql-surface, sql, types-constraints, catalog-inventory, partitioning, extension, security, mvcc, locking, deadlock, planner, statistics, index, performance, wal, backup-recovery, pitr, replication, logical-replication, observability, maintenance, failure-injection, migration, upgrade, pg-upgrade, compatibility-matrix, reference-system]
    steps:
      - name: Checkout PostgreSQL Atlas
        uses: actions/checkout@v4
        with:
          path: postgresql-reference-atlas
      - name: Install CI dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run ${{ matrix.lab }} lab
        run: make -C postgresql-reference-atlas lab LAB=${{ matrix.lab }}
