name: atlas-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PostgreSQL Atlas
        uses: actions/checkout@v4
        with:
          path: postgresql-reference-atlas
      - name: Checkout reference-atlas-core v1
        uses: actions/checkout@v4
        with:
          repository: akaitigo/reference-atlas-core
          ref: cf9e6e2d981305c83f970c1f21a1ddc9c1109263
          path: reference-atlas-core
      - name: Install CI dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate common manifests
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core validate
      - name: Audit mastery and cross-manifest contracts
        run: make -C postgresql-reference-atlas CORE_DIR=../reference-atlas-core audit
      - name: Evaluate router skill
        run: make -C postgresql-reference-atlas eval
      - name: Run static publication gates
        run: make -C postgresql-reference-atlas test-static
      - name: Check committed evidence freshness
        run: make -C postgresql-reference-atlas evidence-freshness

  executable-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lab: [authority-lock, sql-surface, sql, types-constraints, catalog-inventory, partitioning, extension, security, mvcc, locking, deadlock, planner, statistics, index, performance, wal, backup-recovery, pitr, replication, logical-replication, observability, maintenance, failure-injection, migration, upgrade, pg-upgrade, compatibility-matrix]
    steps:
      - name: Checkout PostgreSQL Atlas
        uses: actions/checkout@v4
        with:
          path: postgresql-reference-atlas
      - name: Install CI dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run ${{ matrix.lab }} lab
        run: make -C postgresql-reference-atlas lab LAB=${{ matrix.lab }}
